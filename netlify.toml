# Netlify: leave "Base directory" empty (the app is at the repo root).
# Publish directory must be ".next" (clear any old "dist" value in the Netlify UI).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Official Next.js adapter - turns the .next output into Netlify CDN files + functions.
# Pinned explicitly so the site never deploys as a raw folder (which serves 404 everywhere).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pings Bing/IndexNow with all sitemap URLs after each successful production deploy.
[[plugins]]
  package = "./netlify/plugins/indexnow"
